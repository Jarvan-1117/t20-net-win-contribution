[project]
name = "net-win-contribution"
version = "0.1.0"
description = "T20 cricket ball-by-ball win probability and player contribution modelling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2,<5",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
    "pyyaml>=6,<7",
    "scikit-learn>=1.7,<2",
    "scipy>=1.14,<2",
    "joblib>=1.4,<2",
]

[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
