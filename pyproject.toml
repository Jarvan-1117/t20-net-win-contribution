[project]
name = "net-win-contribution"
version = "0.1.0"
description = "T20 cricket ball-by-ball win probability and player contribution modelling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
