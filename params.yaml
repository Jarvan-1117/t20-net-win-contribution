project:
  status: proposed
  state_timestamp: post_delivery
  include_pregame_state: true
  gender_models:
    - female
    - male
  innings_models:
    - 1
    - 2
  excluded_outcomes:
    - no_result
    - tie
    - dls
    - super_over
  # Keep all eligible T20I matches in the baseline.  The legacy notebook's
  # top-11 filter remains available as a sensitivity analysis, not a default.
  team_scope: all_teams
  legacy_top_11:
    - Sri Lanka
    - India
    - South Africa
    - West Indies
    - England
    - New Zealand
    - Australia
    - Ireland
    - Pakistan
    - Zimbabwe
    - Bangladesh

validation:
  split_unit: match_id
  split_strategy: chronological
  primary_metric: log_loss
  calibration_metrics:
    - brier_score
    - reliability_curve
